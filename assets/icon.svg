<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gmailRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ea4335"/>
    </linearGradient>
    <linearGradient id="gmailBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#4285f4"/>
    </linearGradient>
    <linearGradient id="gmailGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#34a853"/>
    </linearGradient>
    <linearGradient id="gmailYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#fbbc05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/>

  <!-- Neural Connection Lines -->
  <g opacity="0.3" stroke="#4285f4" stroke-width="2" stroke-dasharray="4,4">
    <line x1="120" y1="140" x2="256" y2="256"/>
    <line x1="392" y1="140" x2="256" y2="256"/>
    <line x1="256" y1="256" x2="256" y2="390"/>
  </g>

  <!-- Outer Glow Envelope / M Shape -->
  <g filter="url(#glow)">
    <!-- Left Column -->
    <path d="M 120 160 L 120 340" stroke="url(#gmailBlue)" stroke-width="18" stroke-linecap="round"/>
    <!-- Right Column -->
    <path d="M 392 160 L 392 340" stroke="url(#gmailGreen)" stroke-width="18" stroke-linecap="round"/>
    <!-- Diagonal Left Flap -->
    <path d="M 120 160 L 256 270" stroke="url(#gmailRed)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Diagonal Right Flap -->
    <path d="M 392 160 L 256 270" stroke="url(#gmailYellow)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Top Bar -->
    <path d="M 135 155 L 377 155" stroke="url(#gmailRed)" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Central Intelligence Core -->
  <circle cx="256" cy="270" r="26" fill="#0f172a" stroke="url(#gmailBlue)" stroke-width="6"/>
  <circle cx="256" cy="270" r="10" fill="#ea4335"/>

  <!-- XTND Wordmark Subtitle -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-weight="900" font-size="32" letter-spacing="8" fill="#f8fafc">
    XTND<tspan fill="#ea4335">·</tspan>GMAIL
  </text>
</svg>
