name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you ship a fix from the Actions tab without a commit.
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  # A pull request's newer push cancels its older run; on main runs queue, so
  # a release is never cut off between its tag and its deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ${{ case(vars.XTND_RUNNER == 'local', 'xtnd-ci', 'ubuntu-latest') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The build stamp (/version) names the commit and its date.
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          # The newest Node release (actions/node-versions lists stable releases
          # only; `latest` would take a pre-release from nodejs.org's index).
          node-version: '*'
          check-latest: true
          package-manager-cache: false
      # @xtnd-dynamics/* come from GitHub Packages (.npmrc); the lockfile holds
      # them. A pull request from a fork gets no secret, so it cannot install them.
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.XTND_PACKAGES_TOKEN }}
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Build the CLI
        run: npm run build
      # Bundles the Worker exactly as a deploy would, without deploying: a
      # binding or import that only fails at bundle time fails the PR.
      - name: Bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
      - name: Audit
        run: npm audit --audit-level=high

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ${{ case(vars.XTND_RUNNER == 'local', 'xtnd-ci', 'ubuntu-latest') }}
    timeout-minutes: 15
    permissions:
      contents: write  # the release commit, its tag and the GitHub release
    steps:
      # main as it stands (not only this push's commit), with the tags and the
      # commits since the last one: semantic-release reads them.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '*'
          check-latest: true
          package-manager-cache: false
      - name: Install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.XTND_PACKAGES_TOKEN }}
        run: npm ci

      # semantic-release (XCore's shared config, .releaserc.json) decides the
      # version from the Conventional Commits since the last vX.Y.Z tag:
      # fix → patch, feat → minor, `!` → major, anything else → no release.
      # A release commits package.json and the lockfile as
      # "chore(release): X.Y.Z" (skipping CI), tags vX.Y.Z, and publishes the
      # GitHub release. Only a release is deployed (XCore docs/VERSION.md).
      - name: Release
        id: release
        run: npx --no-install xsuite-release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The stamp again, now with the released version and commit
      # (prebuild: xsuite-stamp), and the CLI build.
      - name: Build
        if: steps.release.outputs.released == 'true'
        run: npm run build

      # An unset secret resolves to an empty string; the run stops here naming
      # it rather than failing later in wrangler.
      - name: Check required secrets
        if: steps.release.outputs.released == 'true'
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set. Add it under Settings → Secrets and variables → Actions."
              exit 1
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Secrets set on the Worker (CREDENTIALS_MASTER_KEY) are kept; the vars,
      # bindings and settings in wrangler.jsonc replace the live ones.
      - name: Deploy
        if: steps.release.outputs.released == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # Deployed is not the same as serving: the new version must answer.
      - name: Verify the deploy answers
        if: steps.release.outputs.released == 'true'
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            body="$(curl -fsS "https://gmail.mcp.xgi.io/version?cb=$(date +%s)" || true)"
            if echo "$body" | grep -q "\"sha\":\"$(git rev-parse --short=7 HEAD)\""; then echo "$body"; exit 0; fi
            sleep 10
          done
          echo "::error::gmail.mcp.xgi.io/version does not report $(git rev-parse --short=7 HEAD) after a minute: $body"
          exit 1

      # The Smithery listing follows each release.
      - name: Sync the Smithery listing
        if: steps.release.outputs.released == 'true'
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          if [ -z "$SMITHERY_API_KEY" ]; then echo "No SMITHERY_API_KEY; the listing is not synced."; exit 0; fi
          npm run sync:smithery
